<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Zip Fixer & Image Extractor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f17;
      color: #f3f4f6;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col justify-between">

  <div class="max-w-4xl mx-auto w-full">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="inline-flex p-3 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-500 mb-3">
        <i class="fa-solid fa-file-zipper text-3xl"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-white">NORMIES Zip Fixer (Mobile Ready)</h1>
      <p class="text-xs sm:text-sm text-gray-400 mt-2">ডাউনলোড হওয়া ব্রোকেন জিপ ফাইলটি আপলোড করুন, সব পিকচার ঠিক হয়ে সুন্দর জিপ ফাইল নেমে যাবে!</p>
    </div>

    <!-- Upload Card -->
    <div class="glass-card p-6 rounded-3xl text-center border-2 border-dashed border-red-500/30 hover:border-red-500/60 transition mb-8">
      <input type="file" id="zipInput" accept=".zip,.txt,.html,*/*" class="hidden" onchange="processZipFile(event)">
      <label for="zipInput" class="cursor-pointer flex flex-col items-center justify-center py-6">
        <i class="fa-solid fa-cloud-arrow-up text-4xl text-red-500 mb-3 animate-bounce"></i>
        <span class="text-sm font-semibold text-white">ফাইল সিলেক্ট করুন (Zip / Text File)</span>
        <span class="text-xs text-gray-400 mt-1">মোবাইলে ডাউনলোড হওয়া ফাইলটি সিলেক্ট করুন</span>
      </label>
    </div>

    <!-- Live Status -->
    <div id="statusBox" class="glass-card p-5 rounded-2xl mb-8 hidden">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-3 h-3 rounded-full bg-red-500 animate-ping"></div>
        <span id="statusText" class="text-xs sm:text-sm font-semibold text-white">প্রসেসিং হচ্ছে...</span>
      </div>
    </div>

    <!-- Actions & Download Button -->
    <div id="downloadAction" class="hidden text-center mb-8">
      <button onclick="downloadCleanZip()" class="w-full sm:w-auto bg-gradient-to-r from-red-600 to-pink-600 text-white font-bold py-3.5 px-8 rounded-2xl hover:opacity-90 transition shadow-lg shadow-red-500/20 flex items-center justify-center gap-3 text-sm mx-auto">
        <i class="fa-solid fa-download text-lg"></i>
        <span>ডাউনলোড করুন (Fixed Clean ZIP)</span>
      </button>
    </div>

    <!-- Preview Gallery -->
    <div id="previewArea" class="hidden">
      <h3 class="text-base font-bold text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-images text-red-500"></i>
        রিকভার হওয়া ছবিসমূহ (<span id="totalCount" class="text-red-400">0</span>)
      </h3>
      <div id="imageGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
    </div>

  </div>

  <footer class="text-center text-xs text-gray-500 mt-8 py-4 border-t border-white/5">
    Mobile Friendly ZIP Repair & Image Extraction System
  </footer>

  <script>
    let extractedFiles = [];

    async function processZipFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusBox = document.getElementById("statusBox");
      const statusText = document.getElementById("statusText");
      const downloadAction = document.getElementById("downloadAction");
      const previewArea = document.getElementById("previewArea");
      const imageGrid = document.getElementById("imageGrid");
      const totalCount = document.getElementById("totalCount");

      statusBox.classList.remove("hidden");
      downloadAction.classList.add("hidden");
      previewArea.classList.add("hidden");
      imageGrid.innerHTML = "";
      extractedFiles = [];

      statusText.innerText = "ফাইল স্ক্যান ও রিকভার করা হচ্ছে...";

      try {
        const arrayBuffer = await file.arrayBuffer();
        const zip = await JSZip.loadAsync(arrayBuffer);

        let filesInZip = Object.keys(zip.files);
        let count = 0;

        for (let fileName of filesInZip) {
          let zipEntry = zip.files[fileName];
          if (zipEntry.dir) continue;

          // Read Content
          let blob = await zipEntry.async("blob");
          let ext = fileName.split('.').pop().toLowerCase();
          
          if (!['svg', 'png', 'jpg', 'jpeg', 'json'].includes(ext)) {
             ext = 'png'; // default fallback
          }

          count++;
          let newName = `${count}.${ext}`;

          let objectUrl = URL.createObjectURL(blob);

          extractedFiles.push({
            name: newName,
            blob: blob,
            url: objectUrl,
            ext: ext
          });
        }

        if (extractedFiles.length === 0) {
          statusText.innerText = "কোনো ছবি বা ফাইল পাওয়া যায়নি! অনুগ্রহ করে সঠিক ফাইল দিন।";
          return;
        }

        // Render Preview
        extractedFiles.forEach(item => {
          let div = document.createElement("div");
          div.className = "glass-card p-2 rounded-2xl border border-white/5 flex flex-col items-center justify-center";
          
          if (item.ext === 'json') {
             div.innerHTML = `
              <div class="w-full aspect-square bg-black/50 rounded-xl flex items-center justify-center text-pink-500 font-mono text-xs">
                 <i class="fa-solid fa-file-code text-2xl"></i>
              </div>
              <span class="text-[10px] text-gray-400 font-mono mt-2">${item.name}</span>
             `;
          } else {
             div.innerHTML = `
              <div class="w-full aspect-square rounded-xl overflow-hidden bg-black/60 flex items-center justify-center">
                <img src="${item.url}" class="w-full h-full object-contain" />
              </div>
              <span class="text-[10px] text-gray-400 font-mono mt-2">${item.name}</span>
             `;
          }
          imageGrid.appendChild(div);
        });

        totalCount.innerText = extractedFiles.length;
        statusText.innerText = `সফলভাবে ${extractedFiles.length} টি ফাইল পাওয়া গেছে!`;
        downloadAction.classList.remove("hidden");
        previewArea.classList.remove("hidden");

      } catch (err) {
        console.error(err);
        statusText.innerText = "ফাইলটি রিড করতে সমস্যা হয়েছে! নিশ্চিত করুন এটি সঠিক ফাইল।";
      }
    }

    async function downloadCleanZip() {
      const statusText = document.getElementById("statusText");
      statusText.innerText = "মোবাইলের উপযোগী ১০০% ক্লিন জিপ ফাইল তৈরি হচ্ছে...";

      const newZip = new JSZip();

      extractedFiles.forEach(file => {
        newZip.file(file.name, file.blob);
      });

      // Pure ZIP binary generator with explicit MIME Type for Mobile Compatibility
      const cleanBlob = await newZip.generateAsync({
        type: "blob",
        compression: "DEFLATE",
        mimeType: "application/zip"
      });

      saveAs(cleanBlob, "NORMIES_Fixed_Images.zip");
      statusText.innerText = "জিপ ফাইল জেনারেট সম্পূর্ণ ও ডাউনলোড শুরু হয়েছে!";
    }
  </script>
</body>
</html>
