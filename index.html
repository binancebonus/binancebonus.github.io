<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robinhood NFT Holder CSV Exporter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      max-width: 650px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { color: #58a6ff; font-size: 24px; margin-bottom: 10px; text-align: center; }
    p.subtitle { text-align: center; color: #8b949e; margin-bottom: 25px; font-size: 14px; }
    
    .info-box {
      background: #21262d;
      border-left: 4px solid #238636;
      padding: 12px 15px;
      margin-bottom: 25px;
      border-radius: 4px;
      font-size: 13px;
      word-break: break-all;
    }
    .info-box span { color: #7ee787; font-weight: bold; }

    .status-container {
      margin-bottom: 20px;
      text-align: center;
    }
    #status { font-weight: bold; color: #d29922; margin-top: 5px; }
    .progress-bar {
      width: 100%;
      background-color: #21262d;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 10px;
      display: none;
    }
    .progress { height: 10px; width: 0%; background-color: #238636; transition: width 0.3s; }

    .btn {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-fetch { background: #238636; color: #fff; }
    .btn-fetch:hover { background: #2ea043; }
    .btn-fetch:disabled { background: #343942; cursor: not-allowed; color: #6e7681; }

    .btn-download { background: #1f6beb; color: #fff; display: none; }
    .btn-download:hover { background: #388bfd; }

    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #8b949e; }
  </style>
</head>
<body>

<div class="card">
  <h1>Robinhood NFT Data Exporter</h1>
  <p class="subtitle">রিয়েল-টাইম ব্লকচেইন ডেটা থেকে CSV রিপোর্ট নামান</p>

  <div class="info-box">
    <strong>নেটওয়ার্ক:</strong> <span>Robinhood Mainnet</span><br>
    <strong>কন্টাক্ট এড্রেস:</strong> <span id="contract">0x68e5a6aaf2503940f0337243063ab8f4da6bedec</span>
  </div>

  <button id="fetchBtn" class="btn btn-fetch" onclick="startProcess()">১. ব্লকচেইন থেকে ডেটা ফেচ করুন</button>

  <div class="status-container">
    <div id="status">স্ট্যাটাস: ডেটা ফেচ করতে উপরের বাটনে ক্লিক করুন</div>
    <div class="progress-bar" id="progressBarContainer">
      <div class="progress" id="progressBar"></div>
    </div>
  </div>

  <hr style="border: 0.5px solid #30363d; margin: 20px 0;">

  <!-- ডাউনলোড বাটনসমূহ -->
  <button id="btnCsv1" class="btn btn-download" onclick="downloadCSV(1)">
    📥 ১. অন্তত ১টি NFT আছে এমন ওয়ালেট (CSV)
  </button>
  <button id="btnCsv2" class="btn btn-download" onclick="downloadCSV(2)">
    🏆 ২. টপ ৫০০ হোল্ডার (CSV)
  </button>
  <button id="btnCsv3" class="btn btn-download" onclick="downloadCSV(3)">
    📋 ৩. সকল হোল্ডার লিস্ট (CSV)
  </button>

  <div class="footer">Powered by Alchemy API & Robinhood Mainnet</div>
</div>

<script>
  const API_KEY_URL = "https://robinhood-mainnet.g.alchemy.com/v2/FXZjUazW6nIgeW8SRwCDZ";
  const CONTRACT_ADDRESS = "0x68e5a6aaf2503940f0337243063ab8f4da6bedec";

  let parsedHolders = []; // { ownerAddress, balance }

  async function startProcess() {
    const fetchBtn = document.getElementById("fetchBtn");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const progressBarContainer = document.getElementById("progressBarContainer");

    fetchBtn.disabled = true;
    status.innerText = "ব্লকচেইন থেকে হোল্ডারদের তথ্য আনা হচ্ছে...";
    status.style.color = "#d29922";
    progressBarContainer.style.display = "block";
    progressBar.style.width = "20%";

    try {
      let pageKey = null;
      let rawOwners = [];

      // Alchemy API pagination call to fetch all owners
      do {
        let url = `${API_KEY_URL}/getOwnersForCollection?contractAddress=${CONTRACT_ADDRESS}&withTokenBalances=true`;
        if (pageKey) {
          url += `&pageKey=${pageKey}`;
        }

        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`API Request Failed! Status: ${response.status}`);
        }
        
        const data = await response.json();
        
        if (data.ownerAddresses) {
          rawOwners = rawOwners.concat(data.ownerAddresses);
        }
        
        pageKey = data.pageKey;
        progressBar.style.width = pageKey ? "60%" : "90%";
      } while (pageKey);

      // Processing holder balances
      parsedHolders = rawOwners.map(item => {
        let count = 0;
        if (item.tokenBalances && item.tokenBalances.length > 0) {
          count = item.tokenBalances.reduce((acc, curr) => acc + parseInt(curr.balance || 1, 10), 0);
        } else {
          count = 1;
        }
        return {
          address: item.ownerAddress,
          balance: count
        };
      });

      // Sort holders by balance descending
      parsedHolders.sort((a, b) => b.balance - a.balance);

      progressBar.style.width = "100%";
      status.innerText = `সফলভাবে মোট ${parsedHolders.length} টি ওয়ালেটের ডেটা পাওয়া গেছে!`;
      status.style.color = "#3fb950";

      // Show Download Buttons
      document.getElementById("btnCsv1").style.display = "block";
      document.getElementById("btnCsv2").style.display = "block";
      document.getElementById("btnCsv3").style.display = "block";

    } catch (error) {
      console.error(error);
      status.innerText = "ভুল হয়েছে! Alchemy API key বা নেটওয়ার্ক চেক করুন।";
      status.style.color = "#f85149";
      fetchBtn.disabled = false;
    }
  }

  function downloadCSV(type) {
    let csvContent = "data:text/csv;charset=utf-8,";
    let filename = "";

    if (type === 1) {
      // 1. At least 1 NFT holder
      const filtered = parsedHolders.filter(h => h.balance >= 1);
      csvContent += "Wallet Address,NFT Count\n";
      filtered.forEach(h => {
        csvContent += `"${h.address}",${h.balance}\n`;
      });
      filename = "At_Least_1_NFT_Holders.csv";

    } else if (type === 2) {
      // 2. Top 500 Holders
      const top500 = parsedHolders.slice(0, 500);
      csvContent += "Rank,Wallet Address,NFT Count\n";
      top500.forEach((h, index) => {
        csvContent += `${index + 1},"${h.address}",${h.balance}\n`;
      });
      filename = "Top_500_Holders.csv";

    } else if (type === 3) {
      // 3. All Holders
      csvContent += "Wallet Address,NFT Count\n";
      parsedHolders.forEach(h => {
        csvContent += `"${h.address}",${h.balance}\n`;
      });
      filename = "All_Holders.csv";
    }

    // Trigger Download
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", filename);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>

</body>
</html>
