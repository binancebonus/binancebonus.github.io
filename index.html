<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robinhood NFT Analytics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      max-width: 650px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { color: #58a6ff; font-size: 22px; margin-bottom: 8px; text-align: center; }
    p.subtitle { text-align: center; color: #8b949e; margin-bottom: 20px; font-size: 13px; }
    
    .info-box {
      background: #21262d;
      border-left: 4px solid #238636;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 13px;
      word-break: break-all;
    }
    .info-box span { color: #7ee787; font-weight: bold; }

    .status-container { margin-bottom: 20px; text-align: center; }
    #status { font-weight: bold; color: #d29922; margin-top: 5px; font-size: 14px; }
    .progress-bar {
      width: 100%;
      background-color: #21262d;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 10px;
      display: none;
    }
    .progress { height: 8px; width: 0%; background-color: #238636; transition: width 0.3s; }

    .btn {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-fetch { background: #238636; color: #fff; }
    .btn-fetch:hover { background: #2ea043; }
    .btn-fetch:disabled { background: #343942; cursor: not-allowed; color: #6e7681; }

    .btn-download { background: #1f6beb; color: #fff; display: none; }
    .btn-download:hover { background: #388bfd; }

    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #8b949e; }
  </style>
</head>
<body>

<div class="card">
  <h1>Robinhood NFT Sales & Holder Analytics</h1>
  <p class="subtitle">অন-চেইন রিয়েল-টাইম ডেটা এক্সপোর্টার</p>

  <div class="info-box">
    <strong>নেটওয়ার্ক:</strong> <span>Robinhood Mainnet</span><br>
    <strong>কন্টাক্ট এড্রেস:</strong> <span>0x68e5a6aaf2503940f0337243063ab8f4da6bedec</span>
  </div>

  <button id="fetchBtn" class="btn btn-fetch" onclick="startProcess()">১. ব্লকচেইন থেকে রিয়েল ডেটা ফেচ করুন</button>

  <div class="status-container">
    <div id="status">স্ট্যাটাস: ফেচ করতে উপরের বাটনে ক্লিক করুন</div>
    <div class="progress-bar" id="progressBarContainer">
      <div class="progress" id="progressBar"></div>
    </div>
  </div>

  <hr style="border: 0.5px solid #30363d; margin: 15px 0;">

  <button id="btnCsv1" class="btn btn-download" onclick="downloadCSV(1)">
    🛒 ১. রিয়েল ক্রেতাদের তালিকা (অন্তত ১টি কিনেছেন + মোট কেনা সংখ্যা)
  </button>
  <button id="btnCsv2" class="btn btn-download" onclick="downloadCSV(2)">
    🏆 ২. বর্তমান টপ ৫০০ হোল্ডার (CSV)
  </button>
  <button id="btnCsv3" class="btn btn-download" onclick="downloadCSV(3)">
    📋 ৩. বর্তমান সকল হোল্ডার লিস্ট (CSV)
  </button>

  <div class="footer">Powered by Robinhood Direct On-Chain RPC</div>
</div>

<script>
  const RPC_URL = "https://robinhood-mainnet.g.alchemy.com/v2/FXZjUazW6nIgeW8SRwCDZ";
  const CONTRACT_ADDRESS = "0x68e5a6aaf2503940f0337243063ab8f4da6bedec";
  
  // ERC-721 / ERC-1155 Transfer Event Signature Topic
  const TRANSFER_TOPIC = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";

  let realBuyersMap = {};   // { buyerAddress: buyCount }
  let currentHoldersMap = {}; // { address: currentBalance }

  function cleanAddress(topic) {
    if (!topic) return "";
    return "0x" + topic.substring(26).toLowerCase();
  }

  async function startProcess() {
    const fetchBtn = document.getElementById("fetchBtn");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const progressBarContainer = document.getElementById("progressBarContainer");

    fetchBtn.disabled = true;
    progressBarContainer.style.display = "block";
    status.innerText = "ব্লকচেইন থেকে ইভেন্ট ল্যাব (Logs) স্ক্যান করা হচ্ছে...";
    status.style.color = "#d29922";
    progressBar.style.width = "30%";

    realBuyersMap = {};
    currentHoldersMap = {};

    try {
      const payload = {
        jsonrpc: "2.0",
        id: 1,
        method: "eth_getLogs",
        params: [{
          fromBlock: "0x0",
          toBlock: "latest",
          address: CONTRACT_ADDRESS,
          topics: [TRANSFER_TOPIC]
        }]
      };

      const response = await fetch(RPC_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const resData = await response.json();

      if (resData.error) {
        throw new Error(resData.error.message || "RPC Error");
      }

      const logs = resData.result || [];
      progressBar.style.width = "70%";
      status.innerText = `মোট ${logs.length} টি অন-চেইন ট্রান্সফার পাওয়া গেছে। হিসাব করা হচ্ছে...`;

      const zeroAddr = "0x0000000000000000000000000000000000000000";

      logs.forEach(log => {
        if (log.topics && log.topics.length >= 3) {
          const fromAddr = cleanAddress(log.topics[1]);
          const toAddr = cleanAddress(log.topics[2]);

          // 1. Current Balance Calculation (+1 to Receiver, -1 to Sender)
          if (toAddr && toAddr !== zeroAddr) {
            currentHoldersMap[toAddr] = (currentHoldersMap[toAddr] || 0) + 1;
          }
          if (fromAddr && fromAddr !== zeroAddr) {
            currentHoldersMap[fromAddr] = (currentHoldersMap[fromAddr] || 0) - 1;
          }

          // 2. Real Buyer Calculation
          // If fromAddr is NOT 0x0 (not minting), then 'toAddr' bought/received from someone
          if (fromAddr && fromAddr !== zeroAddr && toAddr && toAddr !== zeroAddr) {
            realBuyersMap[toAddr] = (realBuyersMap[toAddr] || 0) + 1;
          }
        }
      });

      progressBar.style.width = "100%";
      const uniqueBuyersCount = Object.keys(realBuyersMap).length;
      
      // Filter out holders with balance > 0
      const activeHolders = Object.keys(currentHoldersMap)
        .filter(addr => currentHoldersMap[addr] > 0);

      status.innerText = `সফল! রিয়েল ক্রেতা: ${uniqueBuyersCount} জন | বর্তমান হোল্ডার: ${activeHolders.length} জন`;
      status.style.color = "#3fb950";

      document.getElementById("btnCsv1").style.display = "block";
      document.getElementById("btnCsv2").style.display = "block";
      document.getElementById("btnCsv3").style.display = "block";

    } catch (err) {
      console.error(err);
      status.innerText = "ভুল হয়েছে! RPC রিকোয়েস্ট ব্যর্থ হয়েছে।";
      status.style.color = "#f85149";
      fetchBtn.disabled = false;
    }
  }

  function downloadCSV(type) {
    let csvContent = "data:text/csv;charset=utf-8,";
    let filename = "";

    if (type === 1) {
      // 1. Real Buyers List
      csvContent += "Buyer Wallet Address (To Address),Total Times Bought\n";
      const sortedBuyers = Object.keys(realBuyersMap)
        .map(addr => ({ address: addr, count: realBuyersMap[addr] }))
        .sort((a, b) => b.count - a.count);

      sortedBuyers.forEach(b => {
        csvContent += `"${b.address}",${b.count}\n`;
      });
      filename = "Real_NFT_Buyers_List.csv";

    } else if (type === 2) {
      // 2. Top 500 Holders
      const holdersList = Object.keys(currentHoldersMap)
        .map(addr => ({ address: addr, balance: currentHoldersMap[addr] }))
        .filter(h => h.balance > 0)
        .sort((a, b) => b.balance - a.balance)
        .slice(0, 500);

      csvContent += "Rank,Wallet Address,Current NFT Balance\n";
      holdersList.forEach((h, index) => {
        csvContent += `${index + 1},"${h.address}",${h.balance}\n`;
      });
      filename = "Top_500_Holders.csv";

    } else if (type === 3) {
      // 3. All Current Holders
      const holdersList = Object.keys(currentHoldersMap)
        .map(addr => ({ address: addr, balance: currentHoldersMap[addr] }))
        .filter(h => h.balance > 0)
        .sort((a, b) => b.balance - a.balance);

      csvContent += "Wallet Address,Current NFT Balance\n";
      holdersList.forEach(h => {
        csvContent += `"${h.address}",${h.balance}\n`;
      });
      filename = "All_Current_Holders.csv";
    }

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", filename);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>

</body>
</html>
