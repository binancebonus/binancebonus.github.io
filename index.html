<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robinhood NFT Real Buyers & Holders Analytics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      max-width: 680px;
      width: 100%;
      padding: 30px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { color: #58a6ff; font-size: 24px; margin-bottom: 10px; text-align: center; }
    p.subtitle { text-align: center; color: #8b949e; margin-bottom: 25px; font-size: 14px; }
    
    .info-box {
      background: #21262d;
      border-left: 4px solid #238636;
      padding: 12px 15px;
      margin-bottom: 25px;
      border-radius: 4px;
      font-size: 13px;
      word-break: break-all;
    }
    .info-box span { color: #7ee787; font-weight: bold; }

    .status-container {
      margin-bottom: 20px;
      text-align: center;
    }
    #status { font-weight: bold; color: #d29922; margin-top: 5px; }
    .progress-bar {
      width: 100%;
      background-color: #21262d;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 10px;
      display: none;
    }
    .progress { height: 10px; width: 0%; background-color: #238636; transition: width 0.3s; }

    .btn {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-fetch { background: #238636; color: #fff; }
    .btn-fetch:hover { background: #2ea043; }
    .btn-fetch:disabled { background: #343942; cursor: not-allowed; color: #6e7681; }

    .btn-download { background: #1f6beb; color: #fff; display: none; }
    .btn-download:hover { background: #388bfd; }

    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #8b949e; }
  </style>
</head>
<body>

<div class="card">
  <h1>Robinhood NFT Sales & Holder Analytics</h1>
  <p class="subtitle">রিয়েল-টাইম অন-চেইন সেলস (Sales) ও হোল্ডার এক্সপোর্টার</p>

  <div class="info-box">
    <strong>নেটওয়ার্ক:</strong> <span>Robinhood Mainnet</span><br>
    <strong>কন্টাক্ট এড্রেস:</strong> <span id="contract">0x68e5a6aaf2503940f0337243063ab8f4da6bedec</span>
  </div>

  <button id="fetchBtn" class="btn btn-fetch" onclick="startProcess()">১. ব্লকচেইন থেকে রিয়েল সেলস ও হোল্ডার ডেটা ফেচ করুন</button>

  <div class="status-container">
    <div id="status">স্ট্যাটাস: ফেচ করতে উপরের বাটনে ক্লিক করুন</div>
    <div class="progress-bar" id="progressBarContainer">
      <div class="progress" id="progressBar"></div>
    </div>
  </div>

  <hr style="border: 0.5px solid #30363d; margin: 20px 0;">

  <!-- ডাউনলোড বাটনসমূহ -->
  <button id="btnCsv1" class="btn btn-download" onclick="downloadCSV(1)">
    🛒 ১. রিয়েল ক্রেতাদের তালিকা (যারা অন্তত ১টি কিনেছেন + মোট কেনা সংখ্যা)
  </button>
  <button id="btnCsv2" class="btn btn-download" onclick="downloadCSV(2)">
    🏆 ২. বর্তমান টপ ৫০০ হোল্ডার (CSV)
  </button>
  <button id="btnCsv3" class="btn btn-download" onclick="downloadCSV(3)">
    📋 ৩. বর্তমান সকল হোল্ডার লিস্ট (CSV)
  </button>

  <div class="footer">Powered by Alchemy NFT Sales & Owners API</div>
</div>

<script>
  const API_KEY_URL = "https://robinhood-mainnet.g.alchemy.com/v2/FXZjUazW6nIgeW8SRwCDZ";
  const CONTRACT_ADDRESS = "0x68e5a6aaf2503940f0337243063ab8f4da6bedec";

  let realBuyersMap = {}; // { buyerAddress: totalBoughtCount }
  let currentHolders = []; // [{ address, balance }]

  async function startProcess() {
    const fetchBtn = document.getElementById("fetchBtn");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");
    const progressBarContainer = document.getElementById("progressBarContainer");

    fetchBtn.disabled = true;
    progressBarContainer.style.display = "block";

    try {
      // -------------------------------------------------------------
      // Step 1: Fetch Real NFT Sales Data via Alchemy NFT Sales API
      // -------------------------------------------------------------
      status.innerText = "ধাপ ১/২: মার্কেটপ্লেসের রিয়েল সেলস (Sales) ডেটা আনা হচ্ছে...";
      status.style.color = "#d29922";
      progressBar.style.width = "25%";

      realBuyersMap = {};
      let pageKey = null;
      let totalSalesFound = 0;

      do {
        let salesUrl = `${API_KEY_URL}/getNFTSales?contractAddress=${CONTRACT_ADDRESS}`;
        if (pageKey) salesUrl += `&pageKey=${pageKey}`;

        const res = await fetch(salesUrl);
        const data = await res.json();

        if (data.nftSales && data.nftSales.length > 0) {
          data.nftSales.forEach(sale => {
            // Buyer Address (To Address)
            const buyerAddress = sale.buyerAddress || sale.toAddress;
            const sellerAddress = sale.sellerAddress || sale.fromAddress;

            // Zero address / Mint exclusion check
            if (
              buyerAddress && 
              buyerAddress.toLowerCase() !== "0x0000000000000000000000000000000000000000" &&
              sellerAddress &&
              sellerAddress.toLowerCase() !== "0x0000000000000000000000000000000000000000"
            ) {
              const quantity = parseInt(sale.quantity || sale.tokensSold || 1, 10);
              realBuyersMap[buyerAddress] = (realBuyersMap[buyerAddress] || 0) + quantity;
              totalSalesFound++;
            }
          });
          pageKey = data.pageKey;
        } else {
          // If getNFTSales is empty or pending, fallback to Transfers filtered for non-zero & sale signatures
          pageKey = null;
        }

        progressBar.style.width = pageKey ? "50%" : "60%";
      } while (pageKey);

      // Fallback Strategy: If NFT Sales API hasn't indexed secondary market yet, use transfer log filters
      if (totalSalesFound === 0) {
        status.innerText = "সেলস এপিআই ব্যাকআপ প্রসেস হচ্ছে (Secondary Transfers)...";
        let transferPageKey = null;

        do {
          const requestBody = {
            id: 1,
            jsonrpc: "2.0",
            method: "alchemy_getAssetTransfers",
            params: [{
              fromBlock: "0x0",
              toBlock: "latest",
              contractAddresses: [CONTRACT_ADDRESS],
              category: ["erc721", "erc1155"],
              withMetadata: false,
              excludeZeroValue: true,
              pageKey: transferPageKey || undefined
            }]
          };

          const res = await fetch(API_KEY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
          });

          const data = await res.json();

          if (data.result && data.result.transfers) {
            data.result.transfers.forEach(tx => {
              const fromAddr = tx.from ? tx.from.toLowerCase() : "";
              const toAddr = tx.to ? tx.to.toLowerCase() : "";
              const zeroAddr = "0x0000000000000000000000000000000000000000";

              // Only transfers that are NOT Mints (from != 0x0) and NOT Burns (to != 0x0)
              if (fromAddr && toAddr && fromAddr !== zeroAddr && toAddr !== zeroAddr) {
                const qty = tx.erc1155Metadata ? parseInt(tx.erc1155Metadata[0].value, 16) : 1;
                realBuyersMap[tx.to] = (realBuyersMap[tx.to] || 0) + qty;
              }
            });
            transferPageKey = data.result.pageKey;
          } else {
            transferPageKey = null;
          }
        } while (transferPageKey);
      }

      // -------------------------------------------------------------
      // Step 2: Fetch Current Holders via Collection Owners API
      // -------------------------------------------------------------
      status.innerText = "ধাপ ২/২: বর্তমান হোল্ডারদের ডেটা আনা হচ্ছে...";
      let holderPageKey = null;
      let rawOwners = [];

      do {
        let url = `${API_KEY_URL}/getOwnersForCollection?contractAddress=${CONTRACT_ADDRESS}&withTokenBalances=true`;
        if (holderPageKey) url += `&pageKey=${holderPageKey}`;

        const res = await fetch(url);
        const data = await res.json();

        if (data.ownerAddresses) {
          rawOwners = rawOwners.concat(data.ownerAddresses);
        }
        holderPageKey = data.pageKey;
      } while (holderPageKey);

      currentHolders = rawOwners.map(item => {
        let count = 0;
        if (item.tokenBalances && item.tokenBalances.length > 0) {
          count = item.tokenBalances.reduce((acc, curr) => acc + parseInt(curr.balance || 1, 10), 0);
        } else {
          count = 1;
        }
        return { address: item.ownerAddress, balance: count };
      });

      currentHolders.sort((a, b) => b.balance - a.balance);

      progressBar.style.width = "100%";
      const uniqueBuyersCount = Object.keys(realBuyersMap).length;
      status.innerText = `সফল! রিয়েল ক্রেতা: ${uniqueBuyersCount} জন | বর্তমান হোল্ডার: ${currentHolders.length} জন`;
      status.style.color = "#3fb950";

      // Show Download Buttons
      document.getElementById("btnCsv1").style.display = "block";
      document.getElementById("btnCsv2").style.display = "block";
      document.getElementById("btnCsv3").style.display = "block";

    } catch (error) {
      console.error(error);
      status.innerText = "ভুল হয়েছে! API বা নেটওয়ার্ক কানেকশন চেক করুন।";
      status.style.color = "#f85149";
      fetchBtn.disabled = false;
    }
  }

  function downloadCSV(type) {
    let csvContent = "data:text/csv;charset=utf-8,";
    let filename = "";

    if (type === 1) {
      // 1. Real Buyers List (Only Bought via Marketplace/Sale, from != 0x0)
      csvContent += "Buyer Wallet Address (To Address),Total Times Bought\n";
      
      const sortedBuyers = Object.keys(realBuyersMap)
        .map(addr => ({ address: addr, count: realBuyersMap[addr] }))
        .sort((a, b) => b.count - a.count);

      sortedBuyers.forEach(b => {
        csvContent += `"${b.address}",${b.count}\n`;
      });
      filename = "Real_NFT_Buyers_List.csv";

    } else if (type === 2) {
      // 2. Top 500 Current Holders
      const top500 = currentHolders.slice(0, 500);
      csvContent += "Rank,Wallet Address,Current NFT Balance\n";
      top500.forEach((h, index) => {
        csvContent += `${index + 1},"${h.address}",${h.balance}\n`;
      });
      filename = "Top_500_Holders.csv";

    } else if (type === 3) {
      // 3. All Current Holders
      csvContent += "Wallet Address,Current NFT Balance\n";
      currentHolders.forEach(h => {
        csvContent += `"${h.address}",${h.balance}\n`;
      });
      filename = "All_Current_Holders.csv";
    }

    // Trigger Download
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", filename);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>

</body>
</html>
